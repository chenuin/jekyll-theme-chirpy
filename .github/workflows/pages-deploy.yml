name: 'Automatic build'
on:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
      - name: Install dependencies
        run: bundle install
      - name: Before srcipt
        run: chmod +x ./script/cibuild
      - name: Srcipt
        run: ./script/cibuild
      - name: Test GitHub API connectivity
        run: |
          echo "Testing GitHub API token..."
          curl -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user \
            -v

          echo "Testing target repository access..."
          echo "Target repository: $REPO_PATH"
          curl -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ secrets.TARGET_REPO }} \
            -v
      - name: Verify git push access
        run: |
          git ls-remote https://${{ secrets.GH_PAT }}@github.com/${{ secrets.TARGET_REPO }}.git
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: ${{ secrets.TARGET_REPO }}
          publish_branch: ${{ secrets.TARGET_BRANCH }}
          publish_dir: ./_site
